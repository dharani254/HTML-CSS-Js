<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Page</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: white;
      background: url("https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg") no-repeat center center fixed;
      background-size: cover;
      height: 200vh; 
      text-align: center;
    }
    .content {
      height: 100vh; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    p {
      font-size: 20px;
      max-width: 700px;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Welcome to My Website</h1>
    <p>Explore amazing content and enjoy the view! Scroll down to see more of the background image.</p>
  </div>
</body>
</html>
