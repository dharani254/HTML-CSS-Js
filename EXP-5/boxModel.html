<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Box Model Example</title>
  <style>
    .box {
      width: 250px;               /* Content width */
      height: 100px;              /* Content height */
      background-color: lightblue; /* Content area */
      padding: 20px;              /* Space between content & border */
      border: 5px solid darkblue; /* Border around the padding */
      margin: 30px;               /* Space outside the border */
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>CSS Box Model Demonstration</h1>
  <div class="box">
    <p>This is the <b>content</b> inside the box.</p>
    <p>Padding adds space around content, border surrounds padding, and margin creates space outside.</p>
  </div>
</body>
</html>
