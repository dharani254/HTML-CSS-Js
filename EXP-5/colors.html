<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Color References</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    .color-box {
      width: 80%;
      margin: 8px auto;
      padding: 6px; 
      border-radius: 4px; 
      font-size: 18px;
      font-weight: bold;
      color: white;
    }

    .named {
      background-color: red;
    }

    .hex {
      background-color: #1e90ff;
    }

    .rgb {
      background-color: rgb(34,139,34);
    }

    .rgba {
      background-color: rgba(255,165,0,0.7);
      color: black;
    }

    .hsl {
      background-color: hsl(300,76%,72%);
      color: black;
    }

    .hsla {
      background-color: hsla(200,100%,50%,0.5);
      color: black;
    }
  </style>
</head>
<body>
  <h1>CSS Color Reference Demo</h1>

  <div class="color-box named">This uses a <b>Named Color</b> → red</div>
  <div class="color-box hex">This uses a <b>Hexadecimal Color</b> → #1e90ff</div>
  <div class="color-box rgb">This uses an <b>RGB Color</b> → rgb(34,139,34)</div>
  <div class="color-box rgba">This uses an <b>RGBA Color</b> → rgba(255,165,0,0.7)</div>
  <div class="color-box hsl">This uses an <b>HSL Color</b> → hsl(300,76%,72%)</div>
  <div class="color-box hsla">This uses an <b>HSLA Color</b> → hsla(200,100%,50%,0.5)</div>
</body>
</html>
