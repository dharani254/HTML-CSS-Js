<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Working of CSS Font and Text Properties</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fafafa;
      margin: 40px;
    }
    h1 {
      text-align: center;
      color: #000;
      text-decoration: underline;
    }
    p {
      font-size: 20px;
      margin: 20px 0;
    }
    .fontsize {
      font-size: 28px;
      color: darkblue;
    }
    .fontweight {
      font-weight: bold;
      color: green;
    }
    .fontstyle {
      font-style: italic;
      color: brown;
    }
    .textdecoration {
      text-decoration: underline;
      color: purple;
    }
    .texttransform {
      text-transform: uppercase;
      color: maroon;
      font-weight: bold;
    }
    .textalign {
      text-align: right;
      color: teal;
    }
  </style>
</head>
<body>
  <h1>Working of CSS Font and Text Properties</h1>
  <p class="fontsize">This text shows <b>font-size</b> property.</p>
  <p class="fontweight">This text shows <b>font-weight</b> property.</p>
  <p class="fontstyle">This text shows <b>font-style</b> property.</p>
  <p class="textdecoration">This text shows <b>text-decoration</b> property.</p>
  <p class="texttransform">This text shows <b>text-transform</b> property.</p>
  <p class="textalign">This text shows <b>text-align</b> property.</p>
</body>
</html>
