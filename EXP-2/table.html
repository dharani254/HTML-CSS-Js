<!DOCTYPE html>
<html>
<head>
  <title>HTML Table Example</title>
</head>
<body>
  <h1>Employee Information Table</h1>
  <table border="1">
    <tr>
      <th>Employee Name</th>
      <th>Department</th>
      <th>Role</th>
      <th>Salary</th>
    </tr>
    <tr>
      <td>Gayatri</td>
      <td>IT</td>
      <td>Developer</td>
      <td>50,000</td>
    </tr>
    <tr>
      <td rowspan="2">Dharani</td>
      <td rowspan="2">HR</td>
      <td>Manager</td>
      <td>60,000</td>
    </tr>
    <tr>
      <td>Recruiter</td>
      <td>40,000</td>
    </tr>
    <tr>
      <td colspan="3">Total Employees</td>
      <td>2</td>
    </tr>
  </table>

</body>
</html>
