<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Input Methods</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 25px;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      background-color: #007BFF;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    input[type="text"] {
      padding: 7px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-left: 5px;
    }
    label {
      display: block;
      margin: 15px 0;
      font-size: 16px;
    }
    #output {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      min-height: 50px;
      font-size: 16px;
      color: #333;
    }
    form {
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>JavaScript Input Demonstration</h1>
  <button onclick="takePrompt()">1. Using prompt()</button><br>
  <label>2. Using HTML Input Field:
    <input type="text" id="textInput" placeholder="Type something">
    <button onclick="takeText()">Submit</button>
  </label><br><br>
  <label>3. Using HTML Form:
    <form onsubmit="takeForm(event)">
      Name: <input type="text" id="formName" required>
      <button type="submit">Submit Form</button>
    </form>
  </label><br>
  <button onclick="takeConfirm()">4. Using confirm()</button>
  <div id="output">
    <p><b>Output will appear here...</b></p>
  </div>
  <script>
    function takePrompt() {
      let name = prompt("Enter your name:");
      document.getElementById("output").innerHTML =
        "You entered (via prompt): <b>" + name + "</b>";
    }
    function takeText() {
      let value = document.getElementById("textInput").value;
      document.getElementById("output").innerHTML =
        "You entered (via input field): <b>" + value + "</b>";
    }
    function takeForm(event) {
      event.preventDefault(); 
      let name = document.getElementById("formName").value;
      document.getElementById("output").innerHTML =
        "You entered (via form): <b>" + name + "</b>";
    }
    function takeConfirm() {
      let result = confirm("Do you like JavaScript?");
      document.getElementById("output").innerHTML =
        "Confirm result: <b>" + (result ? "Yes" : "No") + "</b>";
    }
  </script>
</body>
</html>
