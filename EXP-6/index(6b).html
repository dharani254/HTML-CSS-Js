<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Output Methods</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f7f7;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #333;
      text-decoration: underline;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    #outputArea {
      margin-top: 25px;
      border: 2px solid #333;
      background-color: #fff;
      padding: 20px;
      width: 60%;
      margin-left: auto;
      margin-right: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #result {
      color: #222;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>JavaScript Output Demonstration</h1>
  <button onclick="showAlert()">1. Alert Box</button>
  <button onclick="showConsole()">2. Console Log</button>
  <button onclick="showDocumentWrite()">3. document.write()</button>
  <button onclick="showInnerHTML()">4. innerHTML</button>
  <button onclick="printPage()">5. Print Page</button>
  <div id="outputArea">
    <p id="result">Output area for innerHTML.</p>
  </div>
  <script>
    function showAlert() {
      alert("This is an alert box!");
    }
    function showConsole() {
      console.log("This message is shown in the browser console.");
      alert("Check the browser console (F12 → Console tab).");
    }
    function showDocumentWrite() {
      document.write("<h2>This text is written using document.write()</h2>");
      document.write("<p>Note: This replaces the entire page content.</p>");
    }
    function showInnerHTML() {
      document.getElementById("result").innerHTML = "This text was updated using <b>innerHTML</b>.";
    }
    function printPage() {
      window.print();
    }
  </script>
</body>
</html>
